name: Build and publish to GitHub Pages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Check out the sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2026
          ref: v5.0.0

      - name: Generate the build files
        run: premake5 ninja

      - name: Build Release x64
        run: ninja Release_x64 -Cbuild

      - name: Make the built executable reproducible
        shell: bash
        run: |
          set -euo pipefail
          test -f build/bin/x64/Release/boiii.exe
          python tools/canonicalize-pe.py build/bin/x64/Release/boiii.exe

      - name: Stage the update site
        shell: bash
        run: |
          set -euo pipefail
          test -f build/bin/x64/Release/boiii.exe
          rm -rf site
          mkdir -p site/boiii
          cp build/bin/x64/Release/boiii.exe site/boiii/boiii.exe
          cp -r data site/boiii/data
          python - <<'PY'
          import hashlib, json, os
          root = 'site/boiii'
          entries = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames.sort()
              for name in sorted(filenames):
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  with open(full, 'rb') as handle:
                      payload = handle.read()
                  entries.append([rel, len(payload), hashlib.sha1(payload).hexdigest().upper()])
          entries.sort(key=lambda item: (item[0] != 'boiii.exe', item[0]))
          with open('site/boiii.json', 'w', encoding='utf-8', newline='\n') as handle:
              json.dump(entries, handle, indent=1)
              handle.write('\n')
          print(f'{len(entries)} files in the manifest')
          PY
          cp site/boiii.json site/boiii/../boiii.json 2>/dev/null || true
          test -f site/boiii.json

      - name: Build the full archive
        shell: bash
        run: |
          set -euo pipefail
          python tools/make-archive.py site/boiii site/codhq-boiii.zip

      # A tag is a release: the same executable and archive the site publishes are
      # attached to a GitHub release, and the launcher's Version selector reads the
      # releases list (see versions.json below), never Ezz's.
      - name: Publish this tag as a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" site/boiii/boiii.exe site/codhq-boiii.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" site/boiii/boiii.exe site/codhq-boiii.zip \
              --repo "$GITHUB_REPOSITORY" --title "CodHQ BOIII $tag" --generate-notes
          fi

      # The launcher offers exactly the releases that exist and carry boiii.exe, so a
      # listed version can never be a dead download. Newest first.
      - name: Write versions.json for the launcher's version list
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python - <<'PY'
          import json
          versions = []
          for release in json.load(open('releases.json', encoding='utf-8')):
              tag = release.get('tag_name', '')
              if '-codhq.' not in tag or release.get('draft') or release.get('prerelease'):
                  continue
              asset = next((item for item in release.get('assets', []) if item.get('name') == 'boiii.exe'), None)
              if asset is None:
                  continue
              versions.append({
                  'tag': tag[1:] if tag.startswith('v') else tag,
                  'url': asset['browser_download_url'],
                  'size': asset['size'],
                  'date': (release.get('published_at') or '')[:10],
              })
          with open('site/versions.json', 'w', encoding='utf-8', newline='\n') as handle:
              json.dump(versions, handle, indent=1)
              handle.write('\n')
          print(f'{len(versions)} version(s): ' + ', '.join(item['tag'] for item in versions))
          PY
          test -s site/versions.json

      - name: Write the site landing page
        shell: bash
        run: |
          set -euo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>CodHQ BOIII</title>
          <style>
          body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #1b1b1b; }
          code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 3px; }
          </style>
          </head>
          <body>
          <h1>CodHQ BOIII</h1>
          <p>This is the update site for the CodHQ BOIII client. It is not a web page you
          play on: the client reads the files below.</p>
          <h2>Download</h2>
          <ul>
          <li><a href="codhq-boiii.zip">codhq-boiii.zip</a>: the client executable and its whole data tree.</li>
          <li><a href="boiii.json">boiii.json</a>: the published file list with size and SHA-1 of every entry.</li>
          <li><a href="boiii/boiii.exe">boiii/boiii.exe</a>: the client executable on its own.</li>
          <li><a href="versions.json">versions.json</a>: the releases the launcher's version selector offers.</li>
          </ul>
          <h2>Installing</h2>
          <p>Install it from the CodHQ setup utility, which pins this release by the
          SHA-256 of <code>codhq-boiii.zip</code> and checks every file against
          <code>boiii.json</code> before and after writing. An installed client updates
          itself from this site when it starts.</p>
          <p>Source: <a href="https://github.com/LarkTheStar/codhq-boiii">LarkTheStar/codhq-boiii</a>.</p>
          </body>
          </html>
          HTML
          test -f site/index.html

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: codhq-bot
          user_email: codhq-bot@users.noreply.github.com
          commit_message: "Publish ${{ github.ref_name }}"
